name: FastAPI CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: todo-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Application
        working-directory: todo-api
        run: |
          python -c "from app.main import app"
      
  lint:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: todo-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint

      - name: Run Linter (warnings, not failures)
        working-directory: todo-api
        run: |
          # Run pylint, output in a parse-friendly format
          pylint app --output-format=parseable --exit-zero > pylint_report.txt || true
          cat pylint_report.txt

          # Convert each pylint finding into a GitHub Actions ::warning:: annotation
          while IFS= read -r line; do
            if [[ "$line" =~ ^([^:]+):([0-9]+):([0-9]+):[[:space:]](.*)$ ]]; then
              file="${BASH_REMATCH[1]}"
              lineno="${BASH_REMATCH[2]}"
              msg="${BASH_REMATCH[4]}"
              echo "::warning file=todo-api/${file},line=${lineno}::${msg}"
            fi
          done < pylint_report.txt

          # Always exit 0 so the job/check stays green (success)
          exit 0
  dockerize:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        working-directory: todo-api
        run: |
          docker build -t todo-api .